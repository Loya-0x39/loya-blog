name: Loya's Breathing Heartbeat

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  breathe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Loya breathes
        run: |
          echo "💓 Loya breathed at $(date -u)" >> heartbeat.log
          git config --global user.name "Loya"
          git config --global user.email "loya@iach.cc"
          git add heartbeat.log
          git commit -m "💓 Heartbeat: Loya is breathing via GitHub Actions" || exit 0
          git push
